name: Update journal RSS

on:
  schedule:
    # 北京时间 08:30、20:30
    - cron: "30 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-journal-rss
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build feeds
        run: python run.py

      - name: Validate XML
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path("docs/feeds").glob("*.xml"))
          if not files:
              raise SystemExit("No RSS files were generated")
          for path in files:
              ET.parse(path)
          print(f"Validated {len(files)} RSS files")
          PY

      - name: Commit updated feeds
        run: |
          git config user.name "journal-rss-bot"
          git config user.email "journal-rss-bot@users.noreply.github.com"
          git add docs data/state.json
          git diff --cached --quiet || git commit -m "chore: update journal feeds"
          git push
