name: Update all 19 journal RSS

on:
  schedule:
    # Beijing time 08:30 and 20:30 (original schedule retained)
    - cron: "30 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Shared with the focused two-journal workflow to prevent competing commits.
concurrency:
  group: journal-rss-repo-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build all 19 feeds
        run: python run.py

      - name: Validate XML
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          files = list(Path("docs/feeds").glob("*.xml"))
          if not files:
              raise SystemExit("No RSS files were generated")

          for path in files:
              ET.parse(path)

          print(f"Validated {len(files)} RSS files")
          PY

      - name: Commit and push with rebase
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "journal-rss-bot"
          git config user.email "journal-rss-bot@users.noreply.github.com"

          git add docs data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update all journal feeds"
          fi

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi

            git rebase --abort 2>/dev/null || true
            echo "Push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 8))
          done

          echo "Failed to synchronize after 3 attempts."
          exit 1
