settings:
  user_agent: "Chinese-Econ-Journal-RSS/0.1 (+personal academic monitoring; low-frequency crawler)"
  timeout_seconds: 35
  max_items_per_source: 40
  min_title_length: 6
  max_title_length: 120
  request_delay_seconds: 1.2
  preserve_old_feed_on_failure: true
  output_dir: "docs/feeds"
  state_file: "data/state.json"

